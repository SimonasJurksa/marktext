name: Release (Linux .deb)

# Linux-only fork: every `v*` tag builds the Ubuntu .deb on GitHub's runners and
# publishes it as a GitHub Release, so other machines can `wget` it. The upstream
# six-platform matrix was dropped on purpose; see README "Scope".

on:
  push:
    # Broad trigger so the validate job can reject malformed v-tags
    # (e.g. `vbad.tag`) instead of them silently not triggering anything.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v0.24.0-sj.4)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    steps:
      - name: Validate semver tag
        run: |
          tag="${RELEASE_TAG}"
          # SemVer 2.0.0 with leading "v"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid semver (expected vX.Y.Z[-prerelease][+build])"
            exit 1
          fi
          echo "Tag '$tag' is valid."

  build:
    name: Build linux-x64
    needs: validate
    runs-on: ubuntu-24.04
    # The native modules (keytar, native-keymap, ced) are compiled here and
    # link against the build machine's glibc, so the build runs inside Ubuntu
    # 20.04: the .deb then installs on 20.04 and on every newer release.
    # Electron 45's V8 headers need GCC 13 (the runner's own 22.04 image stops
    # at GCC 11), which 20.04 gets from the toolchain PPA; libstdc++ is linked
    # statically so the target machine does not need GCC 13's runtime either.
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: gcc-13
      CXX: g++-13
      LDFLAGS: -static-libstdc++ -static-libgcc
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common ca-certificates curl git gnupg
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-13 make binutils pkg-config python3 python3-distutils \
            icnsutils graphicsmagick xz-utils unzip \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev

      - name: Check out Git repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      - name: Cache Electron binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-linux-

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: '0'

      - name: Build .deb
        run: pnpm run build:linux:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Guards the promise above: fail loudly if a native module in the .deb
      # needs a glibc or libstdc++ symbol newer than Ubuntu 20.04 ships.
      - name: Check native modules load on Ubuntu 20.04
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb | head -n 1)
          unpacked=$(mktemp -d)
          dpkg-deb -x "$deb" "$unpacked"
          newest_version() {
            objdump -T "$1" | { grep -oE "$2_[0-9.]+" || true; } | sed "s/^$2_//" | sort -uV | tail -n 1
          }
          fail=0
          while IFS= read -r node; do
            for spec in GLIBC:2.31 GLIBCXX:3.4.28; do
              prefix=${spec%%:*}
              limit=${spec##*:}
              newest=$(newest_version "$node" "$prefix")
              if [ -z "$newest" ]; then
                continue
              fi
              echo "${node#"$unpacked"}: ${prefix}_${newest}"
              if [ "$(printf '%s\n%s\n' "$limit" "$newest" | sort -V | tail -n 1)" != "$limit" ]; then
                echo "::error::${node#"$unpacked"} needs ${prefix}_${newest}; Ubuntu 20.04 ships ${prefix}_${limit}"
                fail=1
              fi
            done
          done < <(find "$unpacked" -name '*.node')
          exit "$fail"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: marktext-linux-x64
          retention-days: 7
          if-no-files-found: error
          path: dist/*.deb

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    # Per-job permissions REPLACE workflow-level ones, so re-declare
    # both: contents:write to publish the release, actions:read for
    # download-artifact's Actions API calls.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the .deb artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: marktext-linux-x64
          path: dist

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          echo "---"
          cat SHA256SUMS.txt

      - name: Compose release notes body
        run: |
          deb=$(cd dist && ls *.deb | head -n 1)
          {
            echo "Linux-only MarkText fork. Ubuntu/Debian x86_64 package built by GitHub Actions from tag \`${RELEASE_TAG}\`; runs on Ubuntu 20.04 and newer."
            echo ""
            echo "## Install"
            echo '```sh'
            echo "wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${deb}"
            echo "sudo apt install ./${deb}"
            echo '```'
            echo "If apt refuses to replace an upstream \`0.24.0~dev\` build, run \`sudo apt remove marktext\` first. The Git features need \`git\` installed."
            echo ""
            echo "## Verifying downloads"
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
            echo ""
            echo "What changed in each \`sj\` build is listed under *Release notes* in the README."
          } > release_body.md

      # Immutable-release repos forbid adding assets to an already-published
      # release, and action-gh-release publishes before uploading the assets.
      # Create the release as a draft (assets allowed), then promote it to a
      # published release in the next step.
      - name: Create draft release with assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          generate_release_notes: true
          name: ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote draft to published release
        run: gh release edit "${RELEASE_TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
